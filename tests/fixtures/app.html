,["1 RUE DES PRES RIANTS\n74000 ANNECY\nFrance"],"+33 6 08 76 03 88"]],null,null,[[null,"Relief Maps est votre guide ultime pour toutes vos aventures en montagne.\u003cbr\u003eQue vous fassiez de la rando à pied, du ski de rando, un long trek, du parapente ou même que vous partiez en alpinisme, repérer vous facilement grace à notre carte 3D.\u003cbr\u003e\u003cbr\u003eRetrouvez la carte IGN comme vous ne l\u0026#39;avez jamais vu en 3D ! \u003cbr\u003e\u003cbr\u003eVous randonnez vers une zone sans connexion internet ? Pas de problème ! Notre app gps offre des cartes hors ligne pour vous permettre de continuer votre navigation même sans réseau. Vous pouvez télécharger les cartes IGN et les utiliser en mode hors ligne, vous serez toujours sûr de votre position et de la direction à prendre.\u003cbr\u003e\u003cbr\u003eRando :\u003cbr\u003eTrouvez des randonnées à proximité, notre catalogue d’itinéraire vous permettra de trouver des sentiers intéressants tout autour de vous, que vous vouliez simplement faire une ballade ou une rando sportive.\u003cbr\u003eNotre système de planification d’itinéraire vous permet aussi de tracer facilement vos propres itinéraires, puis de les exporter en GPX.\u003cbr\u003e\u003cbr\u003eAlpinisme :\u003cbr\u003eConsultez les topos de camp to camp et skitour avec trace GPS et retrouvez facilement le début de la voie de vos rêves ! Du Mont Blanc à l\u0026#39;Aiguille Verte par le couloir whymper, grimpez tous les sommets des Alpes !\u003cbr\u003e Profitez de la meilleures visualisation 3D disponible sur Chamonix et les alpes françaises.\u003cbr\u003e\u003cbr\u003eEscalade :\u003cbr\u003eNe cherchez plus le départ d’une voie pendant des heures ! Retrouver le début d\u0026#39;une voie avec les trace GPX disponibles dans l\u0026#39;app\u003cbr\u003e\u003cbr\u003eTrek :\u003cbr\u003eUn trek sur plusieurs jours ? Vous pouvez planifier votre aventure facilement avec Relief Maps.\u003cbr\u003eRetrouver une liste de point d’intérêt qui vous aidera, refuges, parkings gratuits, points d’eau, toilettes, campings \u0026amp; bivouac etc.\u003cbr\u003eTrouvez les meilleurs chemins sur nos cartes topo et IGN, calculez la distance, le dénivelé et la durée de votre parcours facilement.\u003cbr\u003eQue vous soyez en trek sur le GR 20 ou sur les chemins de Compostelle Relief Maps vous accompagne partout !\u003cbr\u003e\u003cbr\u003eSki de randonnée :\u003cbr\u003eParcourez la montagne à ski avec nos outils pour le ski de rando.\u003cbr\u003eAnalyser le terrain avec les cartes des pentes en réalité augmenté ou en 3D.\u003cbr\u003eProfitez de prévision météo détaillée avec chutes de neige, températures par altitudes etc.\u003cbr\u003eConsultez les topos de skitour et camp to camp partout en France et en Europe.\u003cbr\u003eProfitez de la meilleures visualisation 3D disponible sur Chamonix et les alpes françaises.\u003cbr\u003e\u003cbr\u003eParapente :\u003cbr\u003eUtilisé lors de la Xalps par de nombreux athlètes, l\u0026#39;app vous offre tous les outils utiles à la pratique du parapente :\u003cbr\u003e- Météo parapente précise, vent, thermique etc.\u003cbr\u003e- Carte des thermiques les plus connus\u003cbr\u003e- Calculateur de finesse\u003cbr\u003e- Live tracking\u003cbr\u003e- Replay de trace\u003cbr\u003e\u003cbr\u003eSki de piste:\u003cbr\u003e- Retrouvez les plans des pistes de grandes stations comme les 3 vallées, val d\u0026#39;isère, la clusaz et bien d\u0026#39;autres\u003cbr\u003e\u003cbr\u003eFonctionnalités gratuite :\u003cbr\u003e- Consultation carte 3D\u003cbr\u003e- Planification itinéraire\u003cbr\u003e- Itinéraire à proximité\u003cbr\u003e- Itinéraire rando, balade, alpinisme, escalade, ski de rando, ski de montagne, marche et vol parapente\u003cbr\u003e- Points d’intérêts (Refuges, points d’eau, parkings gratuits etc.)\u003cbr\u003e- Enregistrement de trace\u003cbr\u003e- Replay trace GPX\u003cbr\u003e- Synchronisation trace avec montre Suunto\u003cbr\u003e- Réalité augmentée\u003cbr\u003e- Calcul de finesse (parapente)\u003cbr\u003e\u003cbr\u003ePremium :\u003cbr\u003e- Cartes Hors lignes\u003cbr\u003e- Livetracking\u003cbr\u003e- Carte IGN\u003cbr\u003e- Prévisions météo\u003cbr\u003e- Sauvegarde/Suivi d\u0026#39;itinéraires\u003cbr\u003e- Cartes des pentes (pour risque d’avalanche ski de rando)\u003cbr\u003e- Carte Hiver\u003cbr\u003e- Cartes Swisstopo\u003cbr\u003e- Import/export GPX\u003cbr\u003e\u003cbr\u003eCartes:\u003cbr\u003e- terrain 3D\u003cbr\u003e- IGN Plan gratuite\u003cbr\u003e- IGN scan\u003cbr\u003e- IGN satellite\u003cbr\u003e- Pente avalanche\u003cbr\u003e- Satellite\u003cbr\u003e- Swisstopo\u003cbr\u003e- Swisstopo satellite\u003cbr\u003e- USGS topo\u003cbr\u003e- USGS satellite\u003cbr\u003e- osm été\u003cbr\u003e- osm hiver\u003cbr\u003e\u003cbr\u003eUne app française créée à Annecy en Haute Savoie ! \u003cbr\u003eL\u0026#39;app est gratuite avec des fonctionnalités premium\u003cbr\u003e\u003cbr\u003e--\u003cbr\u003e\u003cbr\u003eAbonnement premium :  29.99€/an\u003cbr\u003e\u003cbr\u003eTerms of use: https://reliefmaps.io/terms.html\u003cbr\u003ePrivacy policy: https://reliefmaps.io/privacy.html"]],[[null,"Carte ign 3D, itinéraires camp to camp et skitour. Tout pour la montagne !"]],[null,null,[[["Lieu",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/4rkEm_eN4F8lAtqf1avrqAQ49_IjMjRduxI5szmftCXmKzSaLsNScjM5DSGQp2qtI5R_fqj8j7aJi_G3dg"]],[[null,"position approximative (réseau)"],[null,"position précise (GPS et réseau)"]],["location_on"]],["Photos/Contenus multimédias/Fichiers",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/pHtIujPWxciAZcfYSwlrGGq14Z984rKLMgcm9RPATLiOlbrWy-tVlelEWgED7gpktgcD1tZizVeHiO5fkw"]],[[null,"Lire le contenu de la mémoire de stockage USB"],[null,"Modifier ou supprimer le contenu de la mémoire de stockage USB"]],["perm_media"]],["Stockage",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/aWNKQedLTpw6u6yyMjQObmuoKu67A1czWnIcvID86oAmMT02r5mNdRn6l9ZN2t2MIyH6tNy-01v7ukeQ"]],[[nul
