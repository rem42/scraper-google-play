ilisation d\u0026#39;un lecteur d\u0026#39;écran. Ce service ajuste uniquement les zones de transmission tactile ; il ne lit, n\u0026#39;enregistre ni ne transmet le contenu de votre écran ou vos données personnelles."]],[[null,"Minecraft est un jeu de placement de blocs et d'excursions en aventures!"]],[null,null,[[["Photos/Contenus multimédias/Fichiers",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/pHtIujPWxciAZcfYSwlrGGq14Z984rKLMgcm9RPATLiOlbrWy-tVlelEWgED7gpktgcD1tZizVeHiO5fkw"]],[[null,"Lire le contenu de la mémoire de stockage USB"],[null,"Modifier ou supprimer le contenu de la mémoire de stockage USB"]],["perm_media"]],["Stockage",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/aWNKQedLTpw6u6yyMjQObmuoKu67A1czWnIcvID86oAmMT02r5mNdRn6l9ZN2t2MIyH6tNy-01v7ukeQ"]],[[null,"Lire le contenu de la mémoire de stockage USB"],[null,"Modifier ou supprimer le contenu de la mémoire de stockage USB"]],["storage"]],["Informations relatives à la connexion Wi-Fi",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/U-_SG8pHTsqU_IyZTGQRkVMdLaAUeq1OnKGrB06KHF1z7vkkIQK3iF0HcbfTe1RnGlh-ajnZkbphl2W3Gdk"]],[[null,"afficher les connexions Wi-Fi"]],["signal_wifi_4_bar"]]],[["Autre",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/pkKXoPl5q7n8T0s7KREtdvUZn1PLRgx-Ox0t4tkO8af4JpgGbyAxLBTsvEKKBCjwBACQsZisSYNmHPGbBA"]],[[null,"afficher les connexions réseau"],[null,"autoriser la réception de données en Wi-Fi multidiffusion"],[null,"bénéficier d'un accès complet au réseau"],[null,"contrôler le vibreur"],[null,"empêcher la mise en veille de l'appareil"],[null,"Vérification de licence Google Play"]],["quiz"]]],[[null,"recevoir des données depuis Internet"]]]],null,null,["com.mojang.minecraftpe"],[[[null,2,[1080,1920],[null,null,"https://play-lh.googleusercontent.com/LvTKBBIfy3RLmCk_EpXDnYMP3NV3MaAOQWnQ1Feuyym2QcmX3sooTLRgkP5KvNp-zGaUyQZ1t11T9YaDea4cdvI"]],[null,2,[1078,1920],[null,null,"https://play-lh.googleusercontent.com/65_6L3XiLPiJ
