<script nonce="x">AF_initDataCallback({key: 'ds:4', hash: '8', data:[[[[]]],[{"8":[["Titeuf : Dieu, le sexe et les bretelles"],null,null,null,[[["Zep"]]],[[null,"\u003cp\u003eZep est un auteur majeur de la bande dessinée. Il a reçu en 2004 le Grand Prix de la ville d’Angoulême. Il donne naissance à Titeuf par hasard, sur un carnet de croquis, alors qu’il dessine des souvenirs d’enfance ! La première planche est publiée dans un fanzine et, à sa lecture, Jean-Claude Camano des éditions Glénat lui propose de l’éditer. Le succès est croissant et devient rapidement un véritable phénomène du monde de l’édition. Plus de 20 millions d’albums de Titeuf ont été vendus, et il est publié dans plus de 25 pays, dont la Chine, la Corée ou le Brésil... En 2001, Zep publie Le Guide du zizi sexuel avec Hélène Bruller. Ensemble, ils lancent également Les Minijusticiers chez Hachette Jeunesse en 2003, dont Zep supervise aussi l’adaptation en série animée diffusée sur TF1. En 2004, il démarre la série Captain Biceps avec Tébo. Il renouvelle la collaboration en 2008 avec la parution de Comment dessiner ? et s’associe également en 2008 avec Stan et Vince pour le lancement de Chronokids. La série raconte les aventures de deux enfants capables de remonter le temps : en 2011, pour le tome 3, la série a reçu le prix de la meilleure série jeunesse au Festival International de la BD d’Angoulême. Adressé à un public adulte, Zep publie en 2009 Happy Sex chez Delcourt suivi de Happy Girls, Happy Rock, Happy Parents et finalement Happy Sex 2. En 2011, c’est une nouvelle étape pour la vie de Titeuf qui a le droit à son film scénarisé et réalisé par Zep. Deux années après, Titeuf fête ses 20 ans et, à cette occasion, une grande exposition lui est consacrée au Salon du livre de Paris, puis au Salon du livre de Genève. La même année, l’ensemble de la série devient disponible en numérique dans le monde entier ! En septembre 2013, avec la parution d’Une histoire d’hommes, Zep propose, dans un tout autre registre, un album au graphisme ouvertement réaliste dont la thématique dresse l’inventaire des passions et des désirs enfouis d’un groupe d’ex-musiciens. De novembre 2014 à avril 2018, il anime régulièrement le blog « What a wonderful world ! », hébergé sur le site internet du quotidien Le Monde. Ses strips sont ensuite repris et publiés en album chez Delcourt en octobre 2015. La même année, outre le 14e tome de Titeuf : Bienvenue en adolescence ! Zep publie en novembre chez Glénat un ouvrage érotique dessiné par Vince : Esmera. En 2016, Zep poursuit son exploration de récits aux dimensions plus réalistes avec Un bruit étrange et beau, une œuvre qui s'apparente à une ode à la liberté et à la simplicité. En 2018, il flirte avec la science-fiction et l'ésotérisme dans The End et l'année suivante, il scénarise Paris 2119 avec Dominique Bertail au dessin. En 2020, Le Guide du zizi sexuel est réédité, Zep profite de l’occasion pour y apporter du contenu inédit et ainsi mettre à jour cet ouvrage aussi drôle que riche d’enseignement. En 2022, il signe Ce que nous sommes, un thriller transhumaniste qu'il scénarise et dessine.\u003c/p\u003e\n"],null,null,null,"Zep"],[[null,"\u003cb\u003ePour la première fois, le tome 1 de Titeuf édité en couleurs !\u003c/b\u003e\u003cp\u003e« Si Dieu est parmi nous comme la prof elle a dit, c’est en tout cas pas Hugo, il est trop gros, ni Manu, ni François parce qu’ils ont des binocles... Dimi c’est pas possible, il parle même pas bien français... Il reste que Ludo mais ça veut dire que Dieu sait pas faire pipi debout. »\u003c/p\u003e\u003cp\u003eTiteuf n’est pas le caïd de la cour de récré, mais il est le «sale gosse» préféré des lecteurs et, il y a 17 ans, comme un OVNI dans le paysage éditorial de l’époque, sortait le premier album de Titeuf. 11 albums plus tard, Zep a entraîné des millions de lecteurs du monde entier et créé un phénomène unique. Dieu, le sexe et les bretelles était paru en noir et blanc : Zep a décidé d’y revenir, pour lui donner un net coup de jeune, et confie pour cela la colorisation à Nob.\u003c/p\u003e"]],[1,1,0],[[null,3,[1912,1400],[null,null,"https://play.google.com/books/content/images/frontcover/aXkq9-R2pwAC?fife"],null,null,null,[50,51,106,255]],1],[["3,4",3.4076433],[null,["43",43],["11",11],["15",15],["15",15],["73",73]],["157",157],["29",29],null,[[]]],[1,1,[1]],[[[[[null,[[5990000,"EUR","5,99 €"]],null,["Acheter","Acheter","Vous pourrez lire ce livre sur le Web et sur les appareils mobiles compatibles."],null,2,[null,null,null,null,null,[null,null,"https://play.google.com/store/books/details?id\u003daXkq9-R2pwAC\u0026rdid\u003dbook-aXkq9-R2pwAC\u0026feature\u003dmd\u0026offerId"]],[null,null,1,2],["CAE\u003d"]]],["E-book : 5,99 €",null,"Acheter"],null,["CgYKBENBRT0\u003d"]],[[[null,[[0,"EUR","0 €"]],null,["Acheter","Acheter"],null,1,[null,null,null,null,null,[null,null,"https://play.google.com/store/books/details?id\u003daXkq9-R2pwAC\u0026rdid\u003dbook-aXkq9-R2pwAC\u0026feature\u003dmd\u0026offerId"]],[null,[],2,2],["CAI\u003d"]]],["Extrait",null,"Acheter"],[null,null,null,null,null,[null,null,"https://play.google.com/books/reader?id\u003daXkq9-R2pwAC\u0026hl\u003dfr"]],["CgYKBENBST0\u003d"]]]],["Glénat BD","2013-03-20","ISBN:9782723477055",2,["mars 2013","2013-03-20",null,[2013,3,20]],"fr","Glénat BD"],[48],["Vol. 1","Titeuf","Dieu, le sexe et les bretelles",1,"Dieu, le sexe et les bretelles",["MYTZFwAAABDpkM",10],null,"Vol. 1",1,[null,null,null,null,[null,null,"/store/books/series?id\u003dMYTZFwAAABDpkM"]],2],null,[[["Auteur",[[[null,"Zep"]]]],["Éditeur",[[[null,"Glénat BD"]]]],["Date de publication",[[[null,"20 mars 2013"]]]],["Pages",[[[null,"48"]]]],["Langue",[[[null,"français"]]]],["ISBN",[[[null,"9782331001451"]]]],["Gemini Notebook",[[[null,"\u003ca href\u003d\"https://support.google.com/googleplay/answer/17068529?hl\u003dfr\"\u003eIndisponible\u003c/a\u003e"]]]],["Infos sur le livre",[[[null,"\u003ca href\u003d\"https://support.google.com/googleplay/answer
